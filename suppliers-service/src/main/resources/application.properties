spring.application.name=suppliers-service
server.port=${SERVER_PORT:8082}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/suppliers_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:catalogos}
spring.datasource.password=${DB_PASSWORD:catalogos_dev}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
