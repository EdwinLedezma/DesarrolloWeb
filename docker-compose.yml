services:
  postgres:
    image: postgres:17-alpine
    container_name: catalogos-postgres
    environment:
      POSTGRES_USER: catalogos
      POSTGRES_PASSWORD: catalogos_dev
      POSTGRES_DB: products_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalogos"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.4
    container_name: catalogos-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_dev
      MYSQL_DATABASE: suppliers_db
      MYSQL_USER: catalogos
      MYSQL_PASSWORD: catalogos_dev
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_dev"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  mysql_data:
